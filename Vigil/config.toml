[general]
# Set false to show startup banners.
quiet = false

# Legacy fallback used when SIEM mode is disabled.
jsonl = true

# Dedupe repeated alerts per (pid + target) for this many ms.
suppress_ms = 1500

[security]
# Require an Authenticode signature before trust can be granted.
require_signature = true

# If true, signer subject must match allowlist.signer_subject_allow.
require_signer_allowlist = true

# Optional fallback by process-name suffix (not recommended).
allow_legacy_process_name_fallback = false

# "none" or "chain" (revocation checks).
revocation_mode = "chain"

# Block known stolen/compromised signer certificates by SHA1 thumbprint.
denylisted_cert_thumbprints = [
    # "ABCD1234..."
]

[concurrency]
# Worker threads for logging/sinks/endpoint forwarding.
worker_threads = 4

# Backpressure for event bursts.
alert_channel_capacity = 8192

# Compatibility block for deployments using the original single socket endpoint.
# New deployments should use [notifications] providers below.
[endpoint_alert]
enabled = false

# Endpoint address in host:port format.
endpoint = "127.0.0.1:9000"

# "udp" or "tcp"
transport = "udp"

connect_timeout_ms = 1500
retries = 2

[notifications]
# Enables all providers marked enabled below.
enabled = false

# HTTP webhook for SOAR, case-management, or notification pipelines.
# Build with --features webhook_notifications.
[[notifications.providers]]
type = "webhook"
name = "primary-soar"
enabled = true
url = "https://soar.example.com/api/v1/hooks/vigil"
format = "json"
timeout_ms = 3000
max_attempts = 3
backoff_ms = 250

# Read the bearer token from the process environment at startup.
bearer_token_env = "VIGIL_SOAR_TOKEN"

# Static non-secret headers are supported.
headers = { "X-Tenant-ID" = "blue-team" }

# Optional routing filters. Empty arrays match every alert.
kinds = ["protected_resource_access", "suspicious_whitelisted_handle_access"]
rules = []
min_severity = 8

# UDP/TCP provider for collectors that accept JSON, CEF, or Sigma JSON.
# Build with --features remote_endpoint.
[[notifications.providers]]
type = "socket"
name = "cef-collector"
enabled = false
endpoint = "127.0.0.1:5514"
transport = "tcp"
format = "cef"
timeout_ms = 1500
max_attempts = 2
backoff_ms = 100
kinds = []
rules = []

[siem]
enabled = true

# Allowed values: jsonl, text, cef, sigma_json
formats = ["jsonl", "cef", "sigma_json"]

generate_sigma_rules = true
sigma_rules_file = "sigma_rules.yml"

[allowlist]
# Signer subject fragments (case-insensitive).
signer_subject_allow = [
    "Microsoft Corporation",
    "Google LLC",
    "Brave Software, Inc.",
    "Mozilla Corporation",
    "Opera Software",
    "Discord Inc"
]

# Optional legacy fallback allowlist by process name suffix.
process_name_allow = [
    "chrome.exe",
    "msedge.exe",
    "firefox.exe",
    "brave.exe",
    "opera.exe",
    "discord.exe"
]

[watch]
# Exact full-path match rules (already normalized to lowercase at load time).
exact_paths = []

[[watch.protected]]
substring = "\\google\\chrome\\user data\\default\\login data"
name = "Chrome Passwords"

[[watch.protected]]
substring = "\\google\\chrome\\user data\\default\\network\\cookies"
name = "Chrome Cookies"

[[watch.protected]]
substring = "\\bravesoftware\\brave-browser\\user data\\default\\login data"
name = "Brave Passwords"

[[watch.protected]]
substring = "\\bravesoftware\\brave-browser\\user data\\default\\network\\cookies"
name = "Brave Cookies"

[[watch.protected]]
substring = "\\microsoft\\edge\\user data\\default\\login data"
name = "MsEdge Passwords"

[[watch.protected]]
substring = "\\microsoft\\edge\\user data\\default\\network\\cookies"
name = "MsEdge Cookies"

[[watch.protected]]
substring = "\\mozilla\\firefox\\profiles"
name = "Firefox Profile Store"

[[watch.protected]]
substring = "\\discord\\local storage\\leveldb"
name = "Discord Token Store"

[[watch.protected]]
substring = "\\.minecraft\\"
name = "Minecraft Data"

[[watch.protected]]
substring = "\\roblox\\cookies"
name = "Roblox Cookies"
